- step:
    name: preprocessing
    image: python
    command:
    - pip install -r requirements.txt
    - python ./preprocess.py {parameters}
    parameters:
    - name: d
      default: 30
      optional: true
      type: float
    inputs:
      - name: input_1
        optional: true
    environment-variables:
      - name: TEST_ENV_VAR
        default: step-value

- pipeline:
    name: inference-pipeline
    nodes:
      - name: preprocessing
        type: execution
        step: preprocessing
        override:
          parameters:
            - name: d
              default: 100
      - name: preprocessing-2
        type: execution
        step: preprocessing
        override:
          environment-variables:
            - name: TEST_ENV_VAR
              default: node-2-value
      - name: preprocessing-3
        type: execution
        step: preprocessing
        override:
          environment-variables:
            - name: TEST_ENV_VAR
              default: node-3-value
    edges:
      - [preprocessing.metadata.diameter, preprocessing-2.parameter.d]
      - [preprocessing.metadata.diameter, preprocessing-3.parameter.d]
