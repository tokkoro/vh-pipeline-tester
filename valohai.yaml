- step:
    name: step-a
    image: python
    command:
    - pip install -r requirements.txt
    - python ./a.py {parameters}
    parameters:
    - name: exec_id
      default: 1
      multiple-separator: ','
      optional: false
      type: integer

- step:
    name: step-io
    image: python
    command:
    - pip install -r requirements.txt
    - python ./io_files.py {parameters}
    parameters:
    - name: param_1
      default: 1
      multiple-separator: ','
      optional: true
      type: integer
    inputs:
      - name: input_1
        optional: true
      - name: input_2
        optional: true

- pipeline:
    name: param-pipeline-massive
    nodes:
      - name: node-a
        type: execution
        step: step-a
      - name: node-b
        type: task
        step: step-a
      - name: node-3
        type: execution
        step: step-a
      - name: node-4
        type: execution
        step: step-a
      - name: node-5
        type: execution
        step: step-a
      - name: node-6
        type: execution
        step: step-a
      - name: node-7
        type: execution
        step: step-a
      - name: node-8
        type: execution
        step: step-a
      - name: node-9
        type: execution
        step: step-a
      - name: node-10
        type: execution
        step: step-a
      - name: node-11
        type: execution
        step: step-a
      - name: node-12
        type: execution
        step: step-a
      - name: node-13
        type: execution
        step: step-a
      - name: node-14
        type: execution
        step: step-a
    edges:
      - [node-a.metadata.next, node-b.parameter.exec_id]

- pipeline:
    name: file-pipeline
    nodes:
      - name: node-c
        type: execution
        step: step-io
      - name: node-d
        type: task
        step: step-io
    edges:
      - [node-c.output.output_1/*, node-d.input.input_1]