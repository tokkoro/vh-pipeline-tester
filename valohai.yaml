- step:
    name: preprocessing
    image: python
    command:
    - pip install -r requirements.txt
    - python ./preprocess.py {parameters}
    parameters:
    - name: d
      default: 30
      optional: true
      type: float
    inputs:
      - name: input_1
        optional: true

- step:
    name: inference
    image: python
    command:
    - pip install -r requirements.txt
    - python ./inference.py {parameters}
    parameters:
    - name: batch_size
      default: 32
      optional: true
      type: float
    - name: precision
      default: fp32
      optional: true
      type: string
    - name: confidence_threshold
      default: 0.66
      optional: true
      type: float
    inputs:
      - name: input_1
        optional: true
      - name: result
        optional: false
        default: s3://tomi-dev/data/01HSF/01HSFZ0FPT62KBJY4TREGHNYMD/upload/knot_result.png


- pipeline:
    name: inference-pipeline
    nodes:
      - name: preprocessing
        type: execution
        step: preprocessing
      - name: inference
        type: execution
        step: inference
    edges:
      - [preprocessing.output.*, inference.input.input_1]
